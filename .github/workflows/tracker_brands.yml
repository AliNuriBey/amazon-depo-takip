name: Marka Takip (10dk)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4 lxml

      - name: Görülen ürünleri cache'den yükle
        uses: actions/cache@v4
        with:
          path: seen_products.json
          key: seen-products-${{ github.run_id }}
          restore-keys: |
            seen-products-

      - name: Marka takip scriptini çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper_brands.py

      - name: Ürün listesini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_products.json || true
          git diff --cached --quiet || git commit -m "chore: marka listesi güncellendi [skip ci]"
          git push || true
